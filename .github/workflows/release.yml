name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_NAME: Notification Center
  MACOS_DEPLOYMENT_TARGET: '11.0'
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check clean selected checkout before native work
        id: set
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py preflight --sha "$GITHUB_SHA"

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check clean selected checkout before native work
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py preflight --sha "$GITHUB_SHA"

      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash .github/scripts/native.sh import-certificate

      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: bash .github/scripts/native.sh store-credentials

      - name: build macOS plugin (universal)
        run: bash .github/scripts/native.sh build

      - name: verify universal binary
        run: bash .github/scripts/native.sh verify

      - name: codesign
        run: bash .github/scripts/native.sh sign

      - name: package, notarize & staple
        run: bash .github/scripts/native.sh package

      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py publish --sha "$GITHUB_SHA" "$ZIP_PATH" "$DMG_PATH"
